<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Wheel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at top, #2b1055, #0b0a12 70%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    max-width: 1000px;
    width: 100%;
  }
  .wheel-box { position: relative; width: 440px; max-width: 90vw; }
  canvas { width: 100%; height: auto; filter: drop-shadow(0 0 25px #a855f7aa); }
  .pointer {
    position: absolute;
    top: -8px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 38px solid #fff;
    filter: drop-shadow(0 2px 6px #000);
    z-index: 2;
  }
  .spin-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 90px; height: 90px;
    border-radius: 50%;
    border: 4px solid #fff;
    background: linear-gradient(135deg, #a855f7, #6d28d9);
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    z-index: 3;
    box-shadow: 0 0 20px #a855f7;
  }
  .spin-btn:disabled { opacity: .6; cursor: not-allowed; }
  .panel {
    background: #ffffff10;
    border: 1px solid #ffffff25;
    border-radius: 18px;
    padding: 24px;
    width: 320px;
    max-width: 90vw;
    backdrop-filter: blur(10px);
  }
  .panel h2 { margin-bottom: 12px; }
  textarea {
    width: 100%;
    height: 220px;
    resize: vertical;
    border-radius: 12px;
    border: 1px solid #ffffff30;
    background: #00000060;
    color: #fff;
    padding: 12px;
    font-size: 16px;
  }
  .hint { font-size: 13px; opacity: .7; margin-top: 8px; }
  .winner {
    margin-top: 16px;
    padding: 14px;
    border-radius: 12px;
    background: linear-gradient(135deg, #a855f740, #6d28d940);
    text-align: center;
    font-size: 20px;
    min-height: 54px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="wheel-box">
    <div class="pointer"></div>
    <canvas id="wheel" width="600" height="600"></canvas>
    <button class="spin-btn" id="spin">DREHEN</button>
  </div>
  <div class="panel">
    <h2>Namen</h2>
    <textarea id="names" placeholder="Ein Name pro Zeile">Anna
Ben
Chris
Dilara
Emil
Fynn</textarea>
    <p class="hint">Ein Name pro Zeile. Das Rad aktualisiert sich automatisch.</p>
    <div class="winner" id="winner">Dreh am Rad!</div>
  </div>
</div>

<script>
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const textarea = document.getElementById('names');
const spinBtn = document.getElementById('spin');
const winnerEl = document.getElementById('winner');
const colors = ['#a855f7','#6d28d9','#ec4899','#f59e0b','#10b981','#3b82f6','#ef4444','#14b8a6'];
let angle = 0;
let spinning = false;

function getNames() {
  return textarea.value.split('\n').map(n => n.trim()).filter(n => n);
}

function draw() {
  const names = getNames();
  const size = canvas.width;
  const c = size / 2;
  ctx.clearRect(0, 0, size, size);
  if (names.length === 0) {
    ctx.fillStyle = '#ffffff20';
    ctx.beginPath(); ctx.arc(c, c, c - 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '28px Arial'; ctx.textAlign = 'center';
    ctx.fillText('Namen eintragen', c, c);
    return;
  }
  const slice = (Math.PI * 2) / names.length;
  names.forEach((name, i) => {
    const start = angle + i * slice;
    ctx.beginPath();
    ctx.moveTo(c, c);
    ctx.arc(c, c, c - 10, start, start + slice);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px Arial';
    ctx.fillText(name.length > 14 ? name.slice(0, 13) + '…' : name, c - 40, 10);
    ctx.restore();
  });
}

function spin() {
  const names = getNames();
  if (spinning || names.length < 2) {
    if (names.length < 2) winnerEl.textContent = 'Mindestens 2 Namen eintragen!';
    return;
  }
  spinning = true;
  spinBtn.disabled = true;
  winnerEl.textContent = '...';
  const extra = Math.PI * 2 * (5 + Math.random() * 4);
  const startAngle = angle;
  const duration = 5000;
  const startTime = performance.now();
  function frame(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 4);
    angle = startAngle + extra * ease;
    draw();
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      spinBtn.disabled = false;
      const slice = (Math.PI * 2) / names.length;
      const pointerAngle = ((3 * Math.PI / 2) - angle) % (Math.PI * 2);
      const norm = (pointerAngle + Math.PI * 2) % (Math.PI * 2);
      const index = Math.floor(norm / slice) % names.length;
      winnerEl.textContent = '🎉 ' + names[index] + ' 🎉';
    }
  }
  requestAnimationFrame(frame);
}

textarea.addEventListener('input', draw);
spinBtn.addEventListener('click', spin);
draw();
</script>
</body>
</html>
